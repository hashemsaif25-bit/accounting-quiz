<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Accounting Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&family=Caveat:wght@400;600;700&family=Courier+Prime:wght@400;700">
<style>
:root{--desk:#1d3a36;--deep:#142a27;--paper:#f4f8ec;--line:#d3e2c9;--ink:#1c2a4a;--mute:#5b6a63;--red:#b3261e;--note:#ffe27a;--gold:#d9a62e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#0e1c1a;--deep:#08110f;--paper:#dfe7d6;--line:#c2d1b6}}
:root[data-theme="dark"]{--desk:#0e1c1a;--deep:#08110f;--paper:#dfe7d6;--line:#c2d1b6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--desk) repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.025) 6px 7px);color:var(--ink);font-family:"Caveat",cursive;font-size:22px}
header{background:var(--deep);padding:14px clamp(16px,4vw,60px) 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.top{margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 24px/1.1 "Bitter",Georgia,serif;color:#f4f8ec}
.brand2{font:400 16px "Bitter",Georgia,serif;color:#9fc0b3;margin-top:3px}
.props{display:flex;gap:2px;align-items:flex-end}
.props svg{width:50px;height:50px}
.props svg:nth-child(1){transform:rotate(-6deg)}.props svg:nth-child(3){transform:rotate(5deg)}.props svg:nth-child(4){transform:rotate(-4deg) translateY(2px)}
.tabs{margin:10px 0 0;display:flex;gap:4px;align-items:flex-end}
.tab{display:flex;align-items:center;gap:7px;font:700 15px "Bitter",Georgia,serif;padding:8px 14px 7px;border:0;border-radius:9px 9px 0 0;background:#2c4f49;color:#cfe3da;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.meta{margin-left:auto;color:#9fc0b3;font:15px "Courier Prime",monospace;padding-bottom:8px}
main{width:100%;padding:0 0 70px}
.pad{--m:clamp(30px,6vw,90px);position:relative;background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);padding:24px clamp(18px,5vw,90px) 30px calc(var(--m) + 20px);min-height:calc(100vh - 150px);box-shadow:0 8px 0 rgba(0,0,0,.25)}
.pad::before{content:"";position:absolute;top:0;bottom:0;left:var(--m);width:5px;border-left:1px solid #d96a62;border-right:1px solid #d96a62}
h1{font:700 26px/1.2 "Bitter",Georgia,serif;margin:0 0 4px}
.sub{font:400 16px "Bitter",Georgia,serif;color:var(--mute);margin:0 0 12px}
.intro{font:400 15px/1.5 "Bitter",Georgia,serif;color:var(--mute);margin:0 0 22px;padding:8px 0;border-top:1px solid var(--mute);border-bottom:1px solid var(--mute)}
.item{padding:12px 0 14px;border-bottom:2px solid #9cb894;overflow-x:auto;opacity:.8}
.item.cur{opacity:1;animation:ink .45s ease-out}
@keyframes ink{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.item.cur{animation:none}}
.q{position:relative;background:var(--note);color:#3a2f06;font:600 21px/1.25 "Caveat",cursive;padding:14px 16px 12px;margin:2px 0 12px;transform:rotate(-.6deg);box-shadow:2px 3px 0 rgba(0,0,0,.18);max-width:94%}
.q::before{content:"";position:absolute;top:-6px;left:14px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse}
td{padding:2px 6px;vertical-align:baseline}
td.d{width:62px;font:600 21px "Caveat",cursive;white-space:nowrap}
.cur td.d{background:linear-gradient(transparent 55%,rgba(246,224,94,.8) 55%)}
td.a{font:600 23px "Caveat",cursive}
tr.cr td.a{padding-left:36px;color:var(--ink)}
td.ref{width:40px;text-align:center;font:15px "Courier Prime",monospace;color:var(--mute)}
td.n{text-align:right;width:96px;white-space:nowrap;font:700 18px "Courier Prime",monospace;border-left:3px double #d96a62}
td.n:last-child{border-right:3px double #d96a62}
.memo td{font:400 19px "Caveat",cursive;color:var(--mute);padding-left:42px;border:0}
.t{display:grid;grid-template-columns:1fr 1fr;position:relative}
.t h3{grid-column:1/-1;margin:0 0 4px;font:700 17px "Bitter",Georgia,serif;display:flex;justify-content:space-between;border-bottom:2px solid var(--ink)}
.t .side{padding:6px 8px;min-height:44px}.t .side+.side{border-left:2px solid var(--ink)}
.t .row{display:flex;justify-content:space-between;gap:8px;font:600 20px "Caveat",cursive}
.t .row span:last-child{font:700 17px "Courier Prime",monospace}
.bal{grid-column:1/-1;border-top:2px solid var(--ink);padding:6px 8px;text-align:right;font:700 17px "Courier Prime",monospace}
.t::after,.stamp{content:"POSTED";position:absolute;right:24%;top:30px;color:var(--red);border:3px solid var(--red);border-radius:6px;padding:0 8px;font:700 22px "Bitter",Georgia,serif;transform:rotate(-12deg);opacity:.7;pointer-events:none}
.tbw{position:relative}.stamp{top:-6px;right:10px}
.tb td{font:600 21px "Caveat",cursive}.tb td.n{width:110px;font:700 18px "Courier Prime",monospace}.tb td:first-child{font:15px "Courier Prime",monospace;width:48px}
.tb tr.tot td{border-top:2px solid var(--ink);border-bottom:4px double var(--ink);font-weight:700}
.empty{text-align:center;padding:30px 0 10px;font:600 24px "Caveat",cursive;color:var(--mute)}.empty svg{width:110px;height:110px;display:block;margin:0 auto 6px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--deep);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;align-items:center}
.btn{font:700 16px "Bitter",Georgia,serif;padding:10px 22px;border-radius:5px;border:2px solid #9fc0b3;background:transparent;color:#e3efe8;cursor:pointer}
.btn.p{background:var(--gold);border-color:var(--gold);color:#2b2005}
.btn:disabled{opacity:.4;cursor:default}
.hint{color:#9fc0b3;font:14px "Bitter",Georgia,serif}
.done{font:600 20px "Caveat",cursive;text-align:center;color:var(--mute);margin:10px 0 0}
@media(min-width:1000px){h1{font-size:34px}.sub{font-size:18px}.intro{font-size:17px}.q{font-size:25px;max-width:80%}td.a{font-size:28px}td.d{font-size:25px;width:80px}td.n{font-size:21px;width:140px}.memo td{font-size:23px}.t .row{font-size:24px}.t .row span:last-child{font-size:19px}.tb td{font-size:25px}.tb td.n{width:150px}.brand{font-size:28px}.props svg{width:60px;height:60px}}
@media(max-width:560px){.pad{--m:24px}td.n{width:70px;font-size:16px}td.d{width:54px}.hint,.props svg:nth-child(n+3){display:none}.t{grid-template-columns:1fr}.t .side+.side{border-left:0;border-top:2px solid var(--ink)}.t::after{right:12%}.tab{padding:8px 10px;font-size:14px}}

.reg{max-width:420px;margin:6px auto 0;display:grid;gap:12px}.reg label{font:700 16px "Bitter",Georgia,serif;display:grid;gap:4px}.reg input{font:600 24px "Courier Prime",monospace;padding:8px 10px;border:2px solid var(--ink);border-radius:4px;background:rgba(255,255,255,.7);color:var(--ink)}.reg input:focus-visible{outline:3px solid var(--gold)}#err{color:var(--red);font:700 16px "Bitter",Georgia,serif;min-height:20px;margin:0}
.code{margin-top:18px}.code textarea{width:100%;min-height:190px;font:600 15px/1.45 "Courier Prime",monospace;padding:10px;border:2px solid var(--ink);border-radius:4px;background:rgba(255,255,255,.7);color:var(--ink);resize:vertical}.code p{font:400 16px/1.45 "Bitter",Georgia,serif;margin:6px 0}.code .btn{border-color:var(--ink);color:var(--ink);margin-top:6px}
.bar{height:8px;background:var(--line);border-radius:4px;margin:0 0 18px}.bar i{display:block;height:100%;width:0;background:#2f5d50;border-radius:4px;transition:width .3s}
.tag{font:400 15px "Courier Prime",monospace;color:var(--mute);margin:0 0 8px}
.qq{font:700 24px/1.3 "Bitter",Georgia,serif;margin:6px 0 10px}
.opt{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--mute);padding:10px 8px;font:600 24px/1.2 "Caveat",cursive;color:var(--ink);cursor:pointer}
.opt b{font:700 15px "Courier Prime",monospace;border:2px solid var(--ink);border-radius:50%;width:28px;height:28px;display:inline-grid;place-items:center;flex:none}
.opt:hover:not(:disabled){background:rgba(246,224,94,.4)}.opt:disabled{cursor:default}
.opt.ok{background:#c5e6c5}.opt.no{background:#f3cfcc;text-decoration:line-through;text-decoration-color:var(--red)}
.exp{font:400 17px/1.5 "Bitter",Georgia,serif;border-left:4px solid var(--red);padding:8px 12px;margin-top:14px;background:rgba(255,255,255,.45)}
.res{position:relative;text-align:center;padding:10px 0}.res .big{font:700 64px "Bitter",Georgia,serif}.res .st{display:inline-block;color:var(--red);border:4px solid var(--red);border-radius:8px;padding:2px 14px;font:700 28px "Bitter",Georgia,serif;transform:rotate(-8deg);margin:6px 0 14px}
.res p{font:400 18px "Bitter",Georgia,serif;margin:4px 0}
.miss{text-align:left;margin-top:18px}.miss .item{opacity:1}.miss .qq{font-size:19px}.miss .ans{font:600 22px "Caveat",cursive;color:#1f6b3a}
@media(min-width:1000px){.qq{font-size:28px}.opt{font-size:28px}.exp{font-size:19px}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="calc" viewBox="0 0 64 64"><rect x="10" y="4" width="44" height="56" rx="6" fill="#2f5d50"/><rect x="15" y="9" width="34" height="14" rx="2" fill="#cfe9d0"/><text x="46" y="20" font-size="11" text-anchor="end" font-family="Courier Prime,monospace" fill="#1c3b30">1,480</text><g fill="#e9efe6"><circle cx="20" cy="32" r="3.6"/><circle cx="32" cy="32" r="3.6"/><circle cx="44" cy="32" r="3.6"/><circle cx="20" cy="41" r="3.6"/><circle cx="32" cy="41" r="3.6"/><circle cx="44" cy="41" r="3.6"/><circle cx="20" cy="50" r="3.6"/><circle cx="32" cy="50" r="3.6"/></g><circle cx="44" cy="50" r="3.6" fill="#e0574f"/></symbol>
<symbol id="coins" viewBox="0 0 64 64"><g fill="#d9a62e" stroke="#9a6f10" stroke-width="2"><rect x="6" y="46" width="32" height="8"/><ellipse cx="22" cy="54" rx="16" ry="5"/><rect x="6" y="38" width="32" height="8"/><ellipse cx="22" cy="46" rx="16" ry="5"/><rect x="6" y="30" width="32" height="8"/><ellipse cx="22" cy="30" rx="16" ry="5" fill="#f0c455"/><circle cx="47" cy="42" r="12" fill="#f0c455"/></g><text x="47" y="48" font-size="16" font-weight="700" text-anchor="middle" font-family="Bitter,serif" fill="#7a5508">$</text></symbol>
<symbol id="book" viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" rx="3" fill="#1d3557"/><rect x="8" y="8" width="9" height="48" fill="#a4262c"/><rect x="23" y="15" width="27" height="15" fill="#f4f8ec"/><path d="M27 21h19M27 26h12" stroke="#1d3557" stroke-width="2"/><rect x="14" y="52" width="42" height="4" fill="#f4f8ec"/></symbol>
<symbol id="pencil" viewBox="0 0 64 64"><g transform="rotate(-40 32 32)"><rect x="26" y="4" width="12" height="42" fill="#f2c230"/><rect x="26" y="4" width="12" height="7" fill="#e58a8a"/><path d="M26 46h12l-6 14z" fill="#e8c9a0"/><path d="M29.5 55h5l-2.5 5z" fill="#333"/></g></symbol>
</defs></svg>
<header><div class="top"><div><div class="brand">Accounting Quiz</div><div class="brand2">Journal, ledger and trial balance</div></div><div class="props" aria-hidden="true"><svg><use href="#calc"/></svg><svg><use href="#book"/></svg><svg><use href="#coins"/></svg><svg><use href="#pencil"/></svg></div></div><div style="height:12px"></div></header>
<main><div class="pad"><div class="bar"><i id="bar"></i></div><div id="stage" aria-live="polite"></div></div></main>
<div class="dock"><button class="btn p" id="next">Start</button><span class="hint">Answer with A-D or click; Enter = next</span></div>
<script>
const Q=(s,n,q,o,e)=>({s,n,q,o,e});
const RAW=[
Q("Surepar","March 1: Invested $50,000 cash in the business","What is the journal entry?",["Dr Cash 50,000 / Cr Share Capital 50,000","Dr Share Capital 50,000 / Cr Cash 50,000","Dr Cash 50,000 / Cr Golf Revenue 50,000","Dr Cash 50,000 / Cr Retained Earnings 50,000"],"Cash (asset) increases with a debit. The owner's investment is equity, so Share Capital is credited. It is not revenue because it is not earned from operations, and Retained Earnings holds accumulated profit, not invested capital."),
Q("Surepar","March 3: Purchased Lee's Golf Land for $38,000 cash. The price consists of land $23,000, building $9,000, and equipment $6,000. (Make one compound entry).","Which entry is correct?",["Dr Land 23,000; Dr Buildings 9,000; Dr Equipment 6,000 / Cr Cash 38,000","Dr Land 38,000 / Cr Cash 38,000","Dr Land 23,000; Dr Buildings 9,000; Dr Equipment 6,000 / Cr Accounts Payable 38,000","Dr Cash 38,000 / Cr Land 23,000; Cr Buildings 9,000; Cr Equipment 6,000"],"A compound entry splits the price across the assets acquired, each at its own cost, and credits Cash once. 23,000 + 9,000 + 6,000 = 38,000 = the credit. It was paid in cash, so Accounts Payable is not used."),
Q("Surepar","March 5: Advertising the opening of the driving range and miniature golf course, paying advertising expenses of $1,600.","Which account is debited, and why?",["Advertising Expenses: the cost was used up to promote the opening","Prepaid Advertising: the benefit comes later","Equipment: it is a long-term cost","Cash: money was paid"],"Advertising is expensed as incurred: Dr Advertising Expenses 1,600 / Cr Cash 1,600. Cash is credited, not debited, because it decreases."),
Q("Surepar","March 6: Paid cash $1,480 for one-year insurance policy.","Which account is debited?",["Prepaid Insurance (an asset)","Insurance Expense","Cash","Unearned Revenue"],"The policy covers a full year, so most of the benefit is in the future. It is recorded as an asset: Dr Prepaid Insurance 1,480 / Cr Cash 1,480, then expensed month by month."),
Q("Surepar","March 10: Purchased golf clubs and other equipment for $2,600 from Palmer Company payable in 30 days.","Which account is credited?",["Accounts Payable 2,600","Cash 2,600","Equipment 2,600","Notes Receivable 2,600"],"Dr Equipment 2,600 / Cr Accounts Payable 2,600. Nothing was paid on March 10, so Cash is untouched. The obligation to Palmer Company is a liability."),
Q("Surepar","March 19: Sold 100 coupon books for $15 each. Each book contains 10 coupons that enable the holder to one round of miniature golf or to hit one bucket of golf balls.","What is the journal entry?",["Dr Cash 1,500 / Cr Unearned Revenue 1,500","Dr Cash 1,500 / Cr Golf Revenue 1,500","Dr Cash 150 / Cr Unearned Revenue 150","Dr Accounts Receivable 1,500 / Cr Golf Revenue 1,500"],"100 books x $15 = $1,500 received in advance. No golf has been provided yet, so the company owes service. That is a liability (Unearned Revenue), not revenue."),
Q("Surepar","March 25: Paid cash dividend for $500 to the shareholders.","Which account is debited, and what is the effect on net income?",["Dividends; no effect on net income","Salaries Expenses; net income decreases","Share Capital; no effect on net income","Dividends; net income decreases"],"A dividend is a distribution to owners, not an expense: Dr Dividends 500 / Cr Cash 500. It reduces Retained Earnings through the Dividends account and never appears in the income statement."),
Q("Surepar","March 31: It is counted 5 coupon books have been used (see transaction on March 19).","What amount of revenue is earned?",["$75 (5 x $15)","$750 (5 x 10 x $15)","$15","$1,425"],"Each book was sold for $15, so 5 books used = $75. Entry: Dr Unearned Revenue 75 / Cr Golf Revenue 75. The 10 coupons per book describe how the book is used; they do not multiply the price. 1,425 is what remains in Unearned Revenue."),
Q("Surepar","","After posting all March transactions, what is the balance of Cash at March 31?",["$8,020 Dr","$7,520 Dr","$9,520 Dr","$10,020 Dr"],"50,000 - 38,000 - 1,600 - 1,480 + 800 + 1,500 - 500 - 600 - 2,600 + 500 = 8,020. The coupon-usage entry on March 31 does not touch Cash. 7,520 forgets the 500 received on March 31."),
Q("Surepar","","What is the balance of Unearned Revenue at March 31?",["$1,425 Cr","$1,500 Cr","$75 Cr","$1,575 Cr"],"1,500 credited on March 19 less 75 debited on March 31 = 1,425 Cr. It is still a liability: 95 books have not been used."),
Q("Surepar","","What is the total Golf Revenue for March?",["$1,375","$1,300","$2,875","$800"],"800 + 500 + 75 = 1,375. Of the 1,500 received on March 19, only the 75 for coupons used is revenue."),
Q("Surepar","March 10: Purchased equipment from Palmer Company on account for $2,600. March 30: Paid Palmer Company in full.","After posting both entries, what is the balance of Accounts Payable?",["Zero","$2,600 Cr","$2,600 Dr","$1,300 Cr"],"Cr 2,600 on March 10, Dr 2,600 on March 30 when it is paid in full. The balance is zero."),
Q("Surepar","","What is the balance of the Equipment account at March 31?",["$8,600 Dr","$6,000 Dr","$2,600 Dr","$11,200 Dr"],"6,000 (March 3, part of the compound entry) + 2,600 (March 10) = 8,600 Dr."),
Q("Holz","May 1: Holz invested $30,000 cash, $2,500 Computer Equipment, and $2,000 car.","What is the credit in the entry?",["Share Capital 34,500","Share Capital 30,000","Revenue 34,500","Share Capital 32,500"],"Three assets were invested: Cash 30,000 + Office Equipment 2,500 + Car 2,000 = 34,500. One compound entry, with the credit to Share Capital 34,500."),
Q("Holz","May 2: Hired a secretary-receptionist at a salary of $1,000 per month.","What is the journal entry?",["No entry: hiring is not a transaction","Dr Salaries Expense 1,000 / Cr Cash 1,000","Dr Salaries Expense 1,000 / Cr Accounts Payable 1,000","Dr Cash 1,000 / Cr Salaries Expense 1,000"],"A promise to pay in the future, with no work done and no cash exchanged, is not recorded. Salaries Expense is recorded when the salary is paid on May 31."),
Q("Holz","May 11: Completed a tax assignment and billed client $1,100 for services rendered.","Which account is debited?",["Accounts Receivable","Cash","Unearned Revenue","Revenue"],"Dr Accounts Receivable 1,100 / Cr Revenue 1,100. The service is done (revenue earned) but not yet collected, so a receivable is created."),
Q("Holz","May 12: Received $3,500 in advance on a management consulting management.","Which account is credited?",["Unearned Revenue (205)","Revenue (400)","Accounts Receivable (112)","Share Capital (301)"],"Cash was received before the work is done: Dr Cash 3,500 / Cr Unearned Revenue 3,500. It is a liability until the consulting is performed."),
Q("Holz","May 31: Paid 40% of balance due Read Supply Company.","How much is paid, and which account is debited?",["$600; Accounts Payable","$600; Supplies","$1,500; Accounts Payable","$900; Cash"],"40% x 1,500 = 600. Dr Accounts Payable 600 / Cr Cash 600. Supplies was already debited on May 3."),
Q("Holz","","What is the balance of the Cash account at May 31?",["$32,200 Dr","$34,700 Dr","$33,100 Dr","$31,600 Dr"],"30,000 - 900 + 3,500 + 1,200 - 1,000 - 600 = 32,200. Only 30,000 of the May 1 investment was cash; the equipment and car are not."),
Q("Holz","","What is the balance of Accounts Payable at May 31?",["$900 Cr","$1,500 Cr","$600 Cr","$2,100 Cr"],"1,500 Cr (May 3) - 600 Dr (May 31) = 900 Cr."),
Q("Holz","","What is the total of the Debit column in the trial balance at May 31, 2002?",["$41,200","$44,300","$39,700","$34,500"],"Debits: Cash 32,200 + Accounts Receivable 1,100 + Supplies 1,500 + Office Equipment 2,500 + Car 2,000 + Salaries 1,000 + Rent 900 = 41,200. Credits: Payable 900 + Unearned 3,500 + Share Capital 34,500 + Revenue 2,300 = 41,200. The 44,300 is the total of the journal, not of the trial balance."),
Q("Holz","","A trial balance is in balance. What does that prove?",["Only that total debits equal total credits","That every transaction was recorded","That every amount was posted to the correct account","That the financial statements are correct"],"It checks arithmetic equality only. An omitted transaction, a wrong account, or equal and opposite errors will not be detected.")
];
const $=id=>document.getElementById(id),L="ABCD";
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let qs,i,score,res,answered;
function start(){qs=RAW.map(r=>({...r,opts:sh(r.o.map((t,k)=>({t,ok:k==0})))}));i=-1;score=0;res=[];next()}
function next(){i++;answered=false;if(i>=qs.length)return finish();show()}
function show(){
 const q=qs[i];$("bar").style.width=(i/qs.length*100)+"%";
 $("stage").innerHTML=`<p class="tag">${q.s=="Holz"?"Iva Holz, CPA":"Surepar Golf"} | Question ${i+1} of ${qs.length}</p>${q.n?`<div class="q">${q.n}</div>`:""}<div class="qq">${q.q}</div>`+q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><b>${L[k]}</b><span>${o.t}</span></button>`).join("")+`<div id="fb"></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 $("next").disabled=true;$("next").textContent=i==qs.length-1?"Finish":"Next question";
}
function pick(k){
 if(answered)return;answered=true;const q=qs[i],ok=q.opts[k].ok;if(ok)score++;
 res.push({q,ok,n:i+1,ch:q.opts[k].t});
 document.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(q.opts[n].ok)b.classList.add("ok");else if(n==k)b.classList.add("no")});
 $("fb").innerHTML=`<div class="exp"><b>${ok?"Correct.":"Not correct."}</b> ${q.e}</div>`;
 $("next").disabled=false;$("next").focus&&0;
}
function finish(){
 $("bar").style.width="100%";const n=qs.length,p=Math.round(score/n*100);
 const part=s=>{const r=res.filter(x=>x.q.s==s);return r.filter(x=>x.ok).length+" / "+r.length};
 const miss=res.filter(x=>!x.ok).map(x=>`<div class="item"><div class="qq">${x.q.n?x.q.n+" ":""}${x.q.q}</div><div class="ans">Answer: ${x.q.opts.find(o=>o.ok).t}</div><div class="exp">${x.q.e}</div></div>`).join("");
 $("stage").innerHTML=`<div class="res"><div class="big">${score} / ${n}</div><div class="st">${p>=80?"WELL DONE":p>=60?"PASS":"REVIEW"} ${p}%</div><p>Surepar Golf: ${part("Surepar")} &nbsp;|&nbsp; Iva Holz, CPA: ${part("Holz")}</p></div>${miss?`<div class="miss"><div class="qq">Questions to review</div>${miss}</div>`:`<p style="text-align:center;font:600 24px Caveat,cursive">No mistakes.</p>`}`;
 const ck=res.length;
 const lines=["UII Accounting Quiz","ID: "+SID+(SNAME?" | Name: "+SNAME:""),"Score: "+score+"/"+n+" ("+p+"%)","Surepar: "+part("Surepar")+" | Holz: "+part("Holz"),res.filter(x=>!x.ok).length?"Wrong answers:":"No wrong answers"].concat(res.filter(x=>!x.ok).map(x=>"Q"+x.n+" ["+x.q.s+"] chose: "+x.ch+" | correct: "+x.q.opts.find(o=>o.ok).t));
 const box=document.createElement("div");box.className="code";
 box.innerHTML='<div class="qq">Your result code</div><p id="snd"></p><p>'+(ENDPOINT?'Backup copy of your result. Send it to your instructor if the automatic submission did not work.':'This page does not send your result to anyone. Copy this text and send it to your instructor.')+'</p><textarea id="rc" readonly></textarea><button class="btn" id="cp">Copy result code</button> <span id="cpm"></span>';
 $("stage").insertBefore(box,$("stage").querySelector(".miss")||null);
 $("rc").value=lines.join("\n");
 sendResult({id:SID,name:SNAME,score:score,total:n,percent:p,surepar:part("Surepar"),holz:part("Holz"),wrong:res.filter(x=>!x.ok).map(x=>({q:x.n,problem:x.q.s,chose:x.ch,correct:x.q.opts.find(o=>o.ok).t}))});
 $("cp").onclick=()=>{const t=$("rc");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value).then(()=>$("cpm").textContent="Copied.",()=>$("cpm").textContent="Select the text and copy it manually.");return}
  $("cpm").textContent=ok?"Copied.":"Select the text and copy it manually."};
 $("next").disabled=false;$("next").textContent="Try again";window.scrollTo({top:0});
}
$("next").onclick=()=>{if(i>=qs.length)start();else next()};
document.addEventListener("keydown",e=>{
 const k=L.indexOf(e.key.toUpperCase());
 if(k>=0&&e.key.length==1&&i>=0&&i<qs.length&&!answered&&k<qs[i].opts.length){pick(k);return}
 if(e.key>="1"&&e.key<="4"&&i>=0&&i<qs.length&&!answered){pick(+e.key-1);return}
 if((e.key=="Enter"||e.key=="ArrowRight")&&!$("next").disabled&&e.target.tagName!="BUTTON"&&e.target.tagName!="TEXTAREA"){e.preventDefault();$("next").click()}
});
const ENDPOINT="https://script.google.com/macros/s/AKfycbwPjsQzwTiTrey1Bcr3sDJi5bZkznXhBmjteyFeFwS7ZR-PaPD3-PrkcS1pkDQx-klGnw/exec";
let SID="",SNAME="",sentFor=null;
function sendResult(payload){
 const el=$("snd");if(!el)return;
 if(!ENDPOINT){el.textContent="";return}
 el.textContent="Sending your result to your instructor...";
 fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
  .then(()=>{el.textContent="Result submitted. If you are not sure it arrived, send the code below as well."},
        ()=>{el.textContent="Could not send automatically. Copy the code below and send it to your instructor."});
}
i=-1;qs=[];$("stage").innerHTML='<div class="empty"><svg><use href="#book"/></svg>22 questions on the journal entries, ledger balances and trial balance from both problems.</div><div class="reg"><label>Student ID<input id="sid" inputmode="numeric" maxlength="15" autocomplete="off"></label><label>Name (optional)<input id="sname" maxlength="60" autocomplete="off"></label><p id="err"></p></div>';
$("next").textContent="Start";
function begin(){const v=$("sid").value.trim();if(!/^[0-9]{5,15}$/.test(v)){$("err").textContent="Enter your student ID (digits only).";$("sid").focus();return}
 SID=v;SNAME=$("sname").value.trim();$("next").onclick=()=>{if(i>=qs.length)start();else next()};start()}
